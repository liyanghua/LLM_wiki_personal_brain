[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-brain"
version = "0.1.0"
description = "Local-first Personal Brain OS Batch 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "litellm>=1.63,<2; python_version < '3.14'",
  "aiohttp>=3.13,<4; python_version >= '3.14'",
  "click>=8.1,<9; python_version >= '3.14'",
  "fastuuid>=0.14,<0.15; python_version >= '3.14'",
  "httpx>=0.28,<0.29; python_version >= '3.14'",
  "importlib-metadata>=8.5,<10; python_version >= '3.14'",
  "jinja2>=3.1,<4; python_version >= '3.14'",
  "jsonschema>=4.23,<5; python_version >= '3.14'",
  "openai>=2,<3; python_version >= '3.14'",
  "python-dotenv>=1,<2; python_version >= '3.14'",
  "tiktoken>=0.12,<0.13; python_version >= '3.14'",
  "tokenizers>=0.22,<0.23; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
